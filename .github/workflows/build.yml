name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Check Java version
      run: java -version

    - name: Show directory contents
      run: ls -la

    - name: Show gradle files
      run: ls -la gradle* gradlew*

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Show gradlew version
      run: ./gradlew --version || true

    - name: Clean project
      run: ./gradlew clean || true

    - name: Build Debug APK
      id: build_debug
      run: |
        echo "=== Starting Debug Build ==="
        ./gradlew assembleDebug --stacktrace
        echo "=== Debug Build Complete ==="

    - name: Build Release APK
      if: success()
      run: |
        echo "=== Starting Release Build ==="
        ./gradlew assembleRelease --stacktrace
        echo "=== Release Build Complete ==="

    - name: List build outputs
      if: always()
      run: |
        echo "=== Debug APK ==="
        ls -lh app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug APK"
        echo ""
        echo "=== Release APK ==="
        ls -lh app/build/outputs/apk/release/ 2>/dev/null || echo "No release APK"

    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
